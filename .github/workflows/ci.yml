name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes LOCAIS (várias janelas do app na mesma máquina). Ver README.
  test:
    name: Testes locais (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar o auxiliar de áudio (C++, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native\bin | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /MT /EHsc /W4 native\telashare-audio.cpp /Fenative\bin\telashare-audio.exe /Fonative\bin\ ole32.lib mmdevapi.lib"
          if (!(Test-Path native\bin\telashare-audio.exe)) { throw 'o auxiliar não foi gerado' }
          native\bin\telashare-audio.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'o auxiliar não respondeu ao --version' }
      # Informativo: a máquina do CI não tem placa de som, então a captura pode não iniciar aqui.
      # O que importa é o auxiliar responder (READY ou um ERROR com o motivo) sem travar.
      - name: Sondar o auxiliar de áudio (informativo)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath native\bin\telashare-audio.exe -ArgumentList "$PID 48000" -RedirectStandardError probe-err.txt -RedirectStandardOutput probe-out.bin -PassThru -NoNewWindow
          Start-Sleep -Seconds 4
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force; "ainda rodando após 4 s (capturando)" }
          "stderr do auxiliar:"; Get-Content probe-err.txt
          "bytes de áudio recebidos: " + (Get-Item probe-out.bin).Length
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: npm test
      - name: Testes (Linux, com tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/local-e2e.js
      # Só informação (#69): a máquina do CI é virtual e sem placa de vídeo, então os números
      # servem para notar uma piora grande, não para comparar com um PC de verdade
      - name: Medir desempenho (Windows, informativo)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run perf -- --rodadas 1
      - name: Medir desempenho (Linux, informativo)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npx electron --no-sandbox test/perf.js --rodadas 1

  # Gera no Windows de verdade (com ícone e metadados aplicados):
  #  - TelaShare-Setup-X.Y.Z.exe + latest.yml + .blockmap: instalador que se atualiza sozinho (#44)
  #  - TelaShare.exe: versão portátil
  build:
    name: Gerar TelaShare.exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar o auxiliar de áudio (C++, Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native\bin | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /MT /EHsc /W4 native\telashare-audio.cpp /Fenative\bin\telashare-audio.exe /Fonative\bin\ ole32.lib mmdevapi.lib"
          if (!(Test-Path native\bin\telashare-audio.exe)) { throw 'o auxiliar não foi gerado' }
          native\bin\telashare-audio.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'o auxiliar não respondeu ao --version' }
      - run: npm run dist
      - name: Conferir os arquivos gerados
        shell: bash
        run: |
          ls -la dist
          test -f dist/TelaShare.exe
          test -f dist/latest.yml
          # o auxiliar de áudio (#35) precisa estar dentro do pacote
          test -f dist/win-unpacked/resources/telashare-audio.exe
          ls dist/TelaShare-Setup-*.exe dist/TelaShare-Setup-*.exe.blockmap
          # o latest.yml precisa apontar para o instalador desta versão
          v=$(node -p "require('./package.json').version")
          grep -q "TelaShare-Setup-$v.exe" dist/latest.yml
      - uses: actions/upload-artifact@v7
        with:
          name: TelaShare-exe
          path: |
            dist/TelaShare.exe
            dist/TelaShare-Setup-*.exe
            dist/TelaShare-Setup-*.exe.blockmap
            dist/latest.yml
          retention-days: 14

  # Ao criar uma tag v*, publica a release com o .exe gerado acima
  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: TelaShare-exe
      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la
          files=(TelaShare.exe TelaShare-Setup-*.exe TelaShare-Setup-*.exe.blockmap latest.yml)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="release-notes/$TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" "${files[@]}" --title "TelaShare $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" "${files[@]}" --title "TelaShare $TAG" --generate-notes
            fi
          fi
